  <div class="list-container">
    <table>
      <thead>
        <tr>
          <th>Armazón</th><th>Marca</th><th class="num">Precio</th><th>Cantidad</th><th>Carrito</th>
        </tr>
      </thead>
      <tbody id="inv-tbody"></tbody>
      <tfoot id="inv-tfoot"></tfoot>
    </table>
  </div>

  <aside class="carrito">
    <div class="table-sell" id="liComp">
      <table>
        <thead>
          <tr>
            <th>Armazón</th><th class="num">Cantidad</th><th class="num">Precio Unitario</th><th class="num">Precio Total</th>
          </tr>
        </thead>
        <tbody id="buy-tbody"></tbody>
        <tfoot id="buy-tfoot"></tfoot>
      </table>
    </div>
  </aside>

  <script>
  let total = 0;
  const data = [];

  document.addEventListener('DOMContentLoaded', async () => {
    const tablaLentes = document.getElementById("inv-tbody");

    const lentesJson = await obtenerDatos();
    const lentes = lentesJson.catalog;

    const iconBag = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-bag-plus" viewBox="0 0 16 16">
        <path fill-rule="evenodd" d="M8 7.5a.5.5 0 0 1 .5.5v1.5H10a.5.5 0 0 1 0 1H8.5V12a.5.5 0 0 1-1 0v-1.5H6a.5.5 0 0 1 0-1h1.5V8a.5.5 0 0 1 .5-.5"/>
        <path d="M8 1a2.5 2.5 0 0 1 2.5 2.5V4h-5v-.5A2.5 2.5 0 0 1 8 1m3.5 3v-.5a3.5 3.5 0 1 0-7 0V4H1v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V4zM2 5h12v9a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1z"/>
      </svg>`;

    // El pie de tabla del carrito
    const pieTabla = document.getElementById("buy-tfoot");
    const pieTr = document.createElement('tr');
    pieTabla.appendChild(pieTr);

    // 1. Texto "Total:" (Ocupa 2 columnas)
    const pieTotal = document.createElement('td');
    pieTotal.colSpan = "2";
    pieTotal.innerText = "Total: ";
    pieTr.appendChild(pieTotal);

    // 2. Celda para el precio total numérico
    const precioTodo = document.createElement('td');
    precioTodo.id = "precio-todo";
    precioTodo.innerText = "0"; // Valor inicial
    pieTr.appendChild(precioTodo);

    // 3. Crear el botón de comprar primero
    const comprarCarritoBtn = document.createElement('button');
    comprarCarritoBtn.innerHTML = iconBag;
    comprarCarritoBtn.id = "comprar-carrito-btn";
    comprarCarritoBtn.addEventListener('click', () => {
      comprarCarrito();
    });

    // 4. Crear la celda e insertar el botón usando appendChild
    const comprarCarritoTd = document.createElement('td');
    comprarCarritoTd.appendChild(comprarCarritoBtn);
    pieTr.appendChild(comprarCarritoTd);


    const iconCarrito = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-cart-plus" viewBox="0 0 16 16">
        <path d="M9 5.5a.5.5 0 0 0-1 0V7H6.5a.5.5 0 0 0 0 1H8v1.5a.5.5 0 0 0 1 0V8h1.5a.5.5 0 0 0 0-1H9z"/>
        <path d="M.5 1a.5.5 0 0 0 0 1h1.11l.401 1.607 1.498 7.985A.5.5 0 0 0 4 12h1a2 2 0 1 0 0 4 2 2 0 0 0 0-4h7a2 2 0 1 0 0 4 2 2 0 0 0 0-4h1a.5.5 0 0 0 .491-.408l1.5-8A.5.5 0 0 0 14.5 3H2.89l-.405-1.621A.5.5 0 0 0 2 1zm3.915 10L3.102 4h10.796l-1.313 7zM6 14a1 1 0 1 1-2 0 1 1 0 0 1 2 0m7 0a1 1 0 1 1-2 0 1 1 0 0 1 2 0"/>
      </svg>`


    for (const lente of lentes) {
      const tr = document.createElement('tr');
      tablaLentes.appendChild(tr);

      // Armazón
      const armazon = document.createElement('td');
      armazon.innerText = lente.nombre;
      tr.appendChild(armazon);

      // Marca
      const marca = document.createElement('td');
      marca.innerText = lente.marca;
      tr.appendChild(marca);

      // Precio
      const precio = document.createElement('td');
      precio.innerText = lente.precioComprado;
      tr.appendChild(precio);

      // Cantidad
      const cantidad = document.createElement('input');
      cantidad.type = 'number';
      cantidad.placeholder = 'Cantidad';
      cantidad.min = 1;
      cantidad.max = lente.stock;
      cantidad.id = "i" + lente.id;
      cantidad.step = 1;
      const tdCantidad = document.createElement('td');
      tdCantidad.appendChild(cantidad);
      tr.appendChild(tdCantidad);

      // Comprar
      const comprar = document.createElement('button');
      comprar.innerHTML = iconCarrito;
      comprar.id = "b" + lente.id;
      comprar.addEventListener('click', () => {
          comprarLente(lente);
      });

      const tdComprar = document.createElement('td');
      tdComprar.appendChild(comprar);
      tr.appendChild(tdComprar);
    }
  });


async function comprarLente(lente) {

  const cantidadInput = document.getElementById("i" + lente.id)

  const cantidad = cantidadInput.value ? Number(cantidadInput.value):1;

  if (!Number.isInteger(cantidad) || cantidad < 1) {
    alert("Cantidad inválida");
    return;
  }

  const carrito = document.getElementById("buy-tbody");
  const precioTodo = document.getElementById("precio-todo");
  const subtotal = lente.precioComprado * cantidad;
  for (let i = 1; i<=cantidad; i++) data.push(lente);
  total += subtotal;

    const tr = document.createElement('tr');
    carrito.appendChild(tr);

    // Armazón
    const armazon = document.createElement('td');
    armazon.innerText = lente.nombre;
    tr.appendChild(armazon);

    // Cantidad
    const tdCantidad = document.createElement('td');
    tdCantidad.innerText = cantidad;
    tr.appendChild(tdCantidad);

    // Precio unitario
    const precioU = document.createElement('td');
    precioU.innerText = lente.precioComprado;
    tr.appendChild(precioU);

    // Precio total
    const precioT = document.createElement('td');
    precioT.innerText = subtotal;
    tr.appendChild(precioT);

    // Actualizar el precio de todo el carrito
    precioTodo.innerText = total;
}

async function comprarCarrito() {
  const lentes = [];
  console.log(data);

  data.forEach(d => {
    const existe = lentes.find(l => l.id === d.id);

    if (existe) {
      console.log('si pasa')
      existe.cantidad++;
    }
    else{
      console.log('no pasa')
      lentes.push({
        id: d.id,
        cantidad: 1,
        precioUnitario: d.precioComprado
      });
    }
  });
  console.log(`Enviando para comprar a la api`);
  console.table(lentes);
  for await (const l of lentes) {
    await enviarCompra(l);
  }
}

async function enviarCompra(datosAEnviar) {
  try {
    const respuesta = await fetch('/api/compras', {
      method: 'POST', 
      headers: {
        'Content-Type': 'application/json' // Indicamos que enviamos un JSON
      },
      body: JSON.stringify(datosAEnviar) 
    });

    if (!respuesta.ok) {
      throw new Error('Error en la respuesta del servidor');
    }

    const resultado = await respuesta.json(); // Leemos la respuesta de la API
    console.log('Compra procesada con éxito:', resultado);
    
  } catch (error) {
    console.error('Hubo un problema al enviar la compra:', error);
  }
}

async function obtenerDatos() {
    try {
        const response = await fetch('/api/lentes');
        return await response.json();
    } catch (error) {
        console.error(error);
    }
}
    
  </script>
</body>
